<style>
#flash-container{width:950px;height:675px;margin:0 auto;background:#000;}
#flash-container ruffle-player{width:950px;height:675px;display:block;}
</style>
<script src="js/jquery-1.9.1.min.js"></script>
<script src="js/script.js"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: "on",
  unmuteOverlay: "hidden",
  splashScreen: false,
  showSwfDownload: false,
  letterbox: "off",
  backgroundColor: "#000000",
  favorFlash: false
};
</script>
<script src="js/ruffle.js"></script>
<script>
var sns_message_link = location.href;
var sns_message="【ノーゲーム・ノーライフ】人類種向け頭脳バトル「唯一神の遊戯」で、9999点を獲得しました。 \n"+sns_message_link;

function facebook_send(total){
  try{
    var msg=sns_message.replace('9999',total);
    var url='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(sns_message_link)+'&quote='+encodeURIComponent(msg);
    window.open(url,'_blank');
  }catch(e){}
}
function twitter_send(total){
  try{
    var msg=sns_message.replace('9999',total);
    var url='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg);
    window.open(url,'_blank');
  }catch(e){}
}
function _getStageNo(){
  try{
    var m=location.search.match(/stage=([1-6])/);
    if(m) return parseInt(m[1],10);
  }catch(e){}
  return 1;
}
window.addEventListener("DOMContentLoaded", function(){
  try{
    var ruffle = window.RufflePlayer.newest();
    var container = document.getElementById("flash-container");
    var player = ruffle.createPlayer();
    player.style.width = "950px";
    player.style.height = "675px";
    container.innerHTML = "";
    container.appendChild(player);
    player.load("NGNL.swf");
  }catch(e){}
});
</script>

<body>
<div id="container">
    <div id="main_contents">
        <div class="game">
            <div id="noflash">
                <div id="flash-container"></div>
            </div>
        </div>
    </div>
